name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest Go the module declares in go.mod, and the current one
        go: ["1.23.x", stable]
    steps:
      - uses: actions/checkout@v7

      # No cache: the module has no dependencies to cache (and no go.sum);
      # the few of the bench module are downloaded on each run.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # The benchmarks live in their own module (it needs a newer Go for testing.B.Loop);
      # this checks that every library extracts the same records.
      - name: Bench module
        if: matrix.go == 'stable'
        working-directory: bench
        run: |
          go vet ./...
          go test -run SameRecords .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # golangci-lint with .golangci.yml: errcheck, govet, ineffassign, staticcheck, unused, misspell, gofmt
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: bench
          args: --config ../.golangci.yml
